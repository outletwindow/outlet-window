name: CI

on:
  push:
    branches: ["main", "work/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  api:
    name: API build, tests, and typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: outlet_window_test
          POSTGRES_USER: outlet_window
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outlet_window -d outlet_window_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply IAM migration to real PostgreSQL
        env:
          PGPASSWORD: ci_only_password
        run: psql -h 127.0.0.1 -U outlet_window -d outlet_window_test -v ON_ERROR_STOP=1 -f database/migrations/0001_identity_access_sessions.sql
      - name: Verify IAM schema constraints and tenant-scoped records
        env:
          PGPASSWORD: ci_only_password
        run: psql -h 127.0.0.1 -U outlet_window -d outlet_window_test -v ON_ERROR_STOP=1 -f database/tests/0001_identity_access_sessions.integration.sql
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
